# ci.sh rewrites newTag on every build of this service.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- serviceaccount.yaml
- clusterrole.yaml
- clusterrolebinding.yaml
- configmap.yaml
- deployment.yaml
- service.yaml
images:
- name: local/sre-agent
  newTag: bootstrap
