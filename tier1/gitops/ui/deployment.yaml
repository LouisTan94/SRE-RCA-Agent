# Managed by ArgoCD from Gitea. Edit here and push; don't kubectl apply.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: apps
  labels:
    app: ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      containers:
      - name: ui
        image: local/ui
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: PRODUCT_SERVICE_URL
          value: "http://product-service.apps.svc.cluster.local:8000"
        - name: ORDER_SERVICE_URL
          value: "http://order-service.apps.svc.cluster.local:8000"
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 15
